spring.application.name=alpha-hotel

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alpha_hotelDb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:change-me}
spring.mail.password=${MAIL_PASSWORD:change-me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.port=8080

app.jwt.secret=${APP_JWT_SECRET:alphaHotelCleSecreteAlphaHotelCleSecrete2025}
app.jwt.expiration-ms=86400000
app.mail.from=${APP_MAIL_FROM:change-me@example.com}
app.mail.notification-admin=${APP_MAIL_NOTIFICATION_ADMIN:change-me@example.com}
app.scheduler.auto-checkout-cron=0 10 0 * * *
app.scheduler.depart-reminder-cron=0 0 18 * * *
app.scheduler.admin-depart-summary-cron=0 0 7 * * *
