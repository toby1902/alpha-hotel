<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Admin - Alpha Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-page">
<nav class="navbar navbar-expand-lg navbar-dark admin-navbar sticky-top">
    <div class="container">
        <div class="d-flex align-items-center gap-3">
            <img th:src="@{/images/logo.png}" alt="Logo Alpha Hotel" class="brand-mark">
            <span class="navbar-brand fw-bold mb-0">Alpha Hotel</span>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white small d-none d-md-inline" sec:authentication="name"></span>
            <form th:action="@{/auth/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Deconnexion</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="admin-action-bar mb-4">
        <a class="btn btn-dark" th:href="@{/admin/dashboard}">Dashboard</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/reservations/nouvelle}">Reservation admin</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/paiements/nouveau}">Paiement</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/chambres/nouvelle}">Chambre</a>
        <a class="btn btn-outline-primary active" th:href="@{/admin/stocks/nouveau}">Stock</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/chambres/disponibles}">Disponibilites</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 surface-glass">
                <div class="card-body p-4 p-lg-5">
                    <span class="badge text-bg-warning text-dark mb-3">PPN</span>
                    <h1 class="h3 fw-bold mb-3">Ajouter un produit de stock</h1>
                    <form th:action="@{/admin/stocks}" th:object="${stockForm}" method="post" class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Produit</label>
                            <input class="form-control" th:field="*{nomProduit}" maxlength="100" pattern="[A-Za-zÀ-ÖØ-öø-ÿ0-9'()\\- ,.]{2,100}" title="Utilisez seulement lettres, chiffres, espaces et ponctuation simple.">
                            <div class="text-danger small mt-1" th:errors="*{nomProduit}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Quantite</label>
                            <input type="number" min="0" class="form-control" th:field="*{quantite}">
                            <div class="text-danger small mt-1" th:errors="*{quantite}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Unite</label>
                            <input class="form-control" th:field="*{unite}" maxlength="30" pattern="[A-Za-zÀ-ÖØ-öø-ÿ ]{2,30}" title="Utilisez uniquement des lettres et espaces.">
                            <div class="text-danger small mt-1" th:errors="*{unite}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Prix unitaire</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{prixUnitaire}">
                            <div class="text-danger small mt-1" th:errors="*{prixUnitaire}"></div>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-dark" type="submit">Enregistrer le stock</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 surface-glass mb-4">
                <div class="card-body p-4">
                    <h2 class="h5 fw-bold mb-3">Alertes actives</h2>
                    <div th:if="${#lists.isEmpty(alertes)}" class="text-muted">Aucune alerte active.</div>
                    <div class="alert alert-warning" th:each="alerte : ${alertes}">
                        <div class="fw-semibold" th:text="${alerte.nomProduit}"></div>
                        <div class="small" th:text="${alerte.messageAlerte}"></div>
                    </div>
                </div>
            </div>
            <div class="card border-0 shadow-sm rounded-4 surface-glass">
                <div class="card-body p-4">
                    <h2 class="h5 fw-bold mb-3">Stock actuel</h2>
                    <div class="border rounded-3 p-3 mb-2" th:each="stock : ${stocks}">
                        <div class="fw-semibold" th:text="${stock.nomProduit}"></div>
                        <div class="small text-muted">Quantite : <span th:text="${stock.quantite}"></span> <span th:text="${stock.unite}"></span></div>
                        <div class="small text-muted">Prix : <span th:text="${stock.prixUnitaire}"></span> Ar</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
