<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Alpha Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <img th:src="@{/images/logo.png}" alt="Logo Alpha Hotel" class="brand-mark">
                        <div>
                            <h1 class="h3 fw-bold mb-1">Alpha Hotel</h1>
                            <p class="text-muted mb-0">Connexion reception et direction</p>
                        </div>
                    </div>

                    <div class="auth-intro mb-4">
                        <span class="badge text-bg-warning text-dark mb-2">Espace Admin</span>
                        <p class="small text-muted mb-0">Accedez au tableau de bord pour valider les reservations, suivre les paiements et piloter l'activite de l'hotel.</p>
                    </div>

                    <div class="alert alert-success" th:if="${param.logout}">
                        Session fermee avec succes.
                    </div>
                    <div class="alert alert-danger" th:if="${erreurConnexion}" th:text="${erreurConnexion}"></div>

                    <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email professionnel</label>
                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   placeholder="admin@alphahotel.com"
                                   maxlength="120"
                                   autocomplete="username"
                                   inputmode="email"
                                   pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}"
                                   oninput="this.value = this.value.toLowerCase()">
                            <div class="text-danger small mt-1" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Mot de passe</label>
                            <input type="password"
                                   class="form-control"
                                   th:field="*{motDePasse}"
                                   placeholder="********"
                                   minlength="6"
                                   maxlength="100"
                                   autocomplete="current-password">
                            <div class="text-danger small mt-1" th:errors="*{motDePasse}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                    </form>
                    <p class="small text-muted mt-4 mb-0">Compte de demonstration : admin@alphahotel.com / Admin@123</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
